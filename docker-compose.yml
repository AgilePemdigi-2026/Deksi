services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: deksi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deksi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deksi-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: docker-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DB_NAME: deksi
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:8001
      FRONTEND_URL: http://localhost:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  laravel:
    build:
      context: ./deksi
      dockerfile: Dockerfile
    container_name: deksi-laravel
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: DEKSI
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: deksi
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      VITE_APP_NAME: DEKSI
    ports:
      - "8001:8001"
    volumes:
      - ./deksi:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules

volumes:
  pgdata:
