services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deksi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deksi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deksi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings_compose
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: deksi
      CORS_ALLOWED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      CSRF_TRUSTED_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    command:
      - sh
      - -c
      - python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/data
      # Folder Scrapping read-only untuk ingest_datasets / fetch_kemenkeu --from-dir.
      - ../Folder Scrapping:/scraping:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      DEKSI_PUBLIC_API_TARGET: http://backend:8000
      DEKSI_AUTH_API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - backend

volumes:
  backend_data:
  pgdata:
